<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>EXIF-анализатор</title>
<style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
    .drop { border: 2px dashed #999; border-radius: 8px; padding: 30px; text-align: center; }
    button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .result { margin-top: 24px; padding: 16px; background: #f4f4f5; border-radius: 8px; }
    .field { margin: 4px 0; }
    .error { color: #b91c1c; }
</style>
</head>
<body>
    <h1>📋 EXIF-анализатор</h1>
    <p>Загрузи фото — покажу метаданные, включая координаты съёмки, если они есть.</p>

    <form class="drop" method="post" enctype="multipart/form-data">
        <input type="file" name="photo" accept="image/*" required>
        <br><br>
        <button type="submit">Извлечь метаданные</button>
    </form>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    {% if lines %}
    <div class="result">
        <p><strong>Файл:</strong> {{ filename }}</p>
        {% for line in lines %}<div class="field">{{ line }}</div>{% endfor %}
    </div>
    {% endif %}
</body>
</html>
